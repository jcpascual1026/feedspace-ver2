<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignIn – FeedSpace</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="main/css/auth.css"/>
    <link rel="stylesheet" href="main/css/base.css" />
    <style>
      /* School ID Input Styling */
      .school-id-input {
        font-family: 'Courier New', monospace;
        font-weight: 700;
        letter-spacing: 1px;
        text-align: center;
      }
      .school-id-helper {
        font-size: 0.8rem;
        color: var(--color-subtext);
        margin-top: 4px;
      }

      /* Password Toggle Styling */
      .password-input-wrapper {
        display: flex;
        align-items: center;
        border: 2px solid var(--color-border, #ddd);
        border-radius: 10px;
        background: var(--color-white, white);
      }
      .password-input-wrapper .form-input {
        flex: 1;
        border: none;
        padding: 11px 14px;
        background: transparent;
      }
      .toggle-password {
        background: var(--color-cream, #f8f9fa);
        border: none;
        color: var(--color-dark, #333);
        cursor: pointer;
        font-size: 1.1rem;
        padding: 8px 12px;
        border-radius: 0 8px 8px 0;
        margin-left: -2px;
      }
      .toggle-password:hover {
        background: #e8f0f7;
      }
    </style> 
  </head>
  <body>
    <div class="MainContainer">
      <!-- Your leftside image container stays the same -->
      <div class="leftside">
        <div class="imgContainer">
        </div>
      </div>

      <div class="rightside">
        <a href="index.html" style="text-decoration: none; color: inherit">
<img src="./feedspace-integration/main/assets/logo-nobg.png" alt="logo" class="sm-logo" /> 
        </a>
        <h1 class="title">Welcome To FeedSpace!</h1>
        <p class="subtitle">Where Ka-Piyu Connects!</p>

        <form action="" class="Loginform" onsubmit="handleLogin(event)"> 
          <h1 class="form-head">Log In</h1>
          
          <!-- EMAIL OR SCHOOL ID -->
          <div class="inputContainer">
            <label for="loginIdentifier">Email or School ID</label>
            <input 
              type="text" 
              id="loginIdentifier"
              class="form-input school-id-input"
              placeholder="0324-0508"
              maxlength="50"
              autocomplete="username"
              required
            />
            <small class="school-id-helper">Use your email or School ID</small>
          </div>

          <!-- PASSWORD -->
          <div class="inputContainer">
            <label for="password">Password</label>
            <div class="password-input-wrapper">
              <input 
                type="password" 
                id="password"
                class="form-input"
                placeholder="Enter your password"
                required
              />
              <button type="button" class="toggle-password" onclick="togglePassword('password')">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          
          <a href="main/html/forgot-password.html"> 
            <p>Forgot password?</p>
          </a> 
          
          <button type="submit" class="signinBtn">Log In</button>
        </form>

        <p>
          Don't have an account yet?
        <a href="main/html/signup.html" class="createacc">Create an Account</a> 
        </p>
      </div>
    </div>

    <script src="main/js/base.js"></script>
    <script src="main/js/auth.js"></script>
  </body>
</html>
