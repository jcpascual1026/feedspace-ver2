<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account – FeedSpace</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../css/base.css"/>
  <link rel="stylesheet" href="../css/auth.css"/>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-container">
      <div class="auth-header">
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join the FeedSpace community today</p>
      </div>

      <form class="auth-form" onsubmit="handleRegister(event)">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="fname">First Name</label>
            <input type="text" id="fname" class="form-input" placeholder="Juan" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="lname">Last Name</label>
            <input type="text" id="lname" class="form-input" placeholder="Dela Cruz" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="student_id">Student ID</label>
          <input type="text" id="student_id" class="form-input" placeholder="0324-0508" maxlength="9" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-input" placeholder="juan@example.com" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="role">Role</label>
          <select id="role" class="form-input" required>
            <option value="">Select your role</option>
            <option value="student">Student</option>
            <option value="instructor">Faculty/Teacher</option>
            <option value="staff">Staff</option>
            <option value="org">Alumni</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="college">College/Department</label>
          <select id="college" class="form-input" required>
            <option value="">Select your college</option>
            <option value="College of Engineering">College of Engineering</option>
            <option value="College of Arts & Sciences">College of Arts & Sciences</option>
            <option value="College of Business">College of Business Administration</option>
            <option value="College of Education">College of Education</option>
            <option value="College of Nursing">College of Computer Studies</option>
            <option value="College of Nursing">College of Industrial Technology</option>
            <option value="College of Nursing">College of Criminal Justice</option>
            <option value="Administration">College of </option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="password" class="form-input" placeholder="••••••••" required />
            <button type="button" class="toggle-password" onclick="togglePassword('password')">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm">Confirm Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="confirm" class="form-input" placeholder="••••••••" required />
            <button type="button" class="togglePassword" onclick="togglePassword('confirm')">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="auth-button">Create Account</button>
      </form>

      <div class="auth-footer">
        <a href="../../index.html">Already have an account? Sign in</a>
      </div>
    </div>
  </div>

  <script src="../js/base.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
