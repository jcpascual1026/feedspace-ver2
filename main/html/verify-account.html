<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Account – FeedSpace</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-container">
        <div class="auth-header">
          <div class="verify-icon">
            <i class="fas fa-shield-alt"></i>
          </div>
          <h1 class="auth-title">Verify Your Account</h1>
          <p class="auth-subtitle">Enter the 6-digit code sent to your email</p>
        </div>

        <form class="auth-form" onsubmit="handleVerify(event)">
          <div class="otp-inputs">
            <input
              type="text"
              class="otp-input"
              maxlength="1"
              inputmode="numeric"
              required
            />
            <input
              type="text"
              class="otp-input"
              maxlength="1"
              inputmode="numeric"
              required
            />
            <input
              type="text"
              class="otp-input"
              maxlength="1"
              inputmode="numeric"
              required
            />
            <input
              type="text"
              class="otp-input"
              maxlength="1"
              inputmode="numeric"
              required
            />
            <input
              type="text"
              class="otp-input"
              maxlength="1"
              inputmode="numeric"
              required
            />
            <input
              type="text"
              class="otp-input"
              maxlength="1"
              inputmode="numeric"
              required
            />
          </div>

          <button type="submit" class="auth-button">Verify Account</button>
        </form>

        <div class="verify-footer">
          <p class="verify-text">Didn't receive the code?</p>
          <button type="button" class="resend-btn" onclick="handleResend()">
            Resend Code
          </button>
        </div>

        <div class="auth-footer">
        <a href="../../index.html">Back to Sign In</a> 
        </div>
      </div>
    </div>

    <script src="../js/base.js"></script>
    <script src="../js/auth.js"></script>
    <script>
      const otpInputs = document.querySelectorAll(".otp-input");

      otpInputs.forEach((input, index) => {
        input.addEventListener("input", (e) => {
          if (e.target.value && index < otpInputs.length - 1) {
            otpInputs[index + 1].focus();
          }
        });

        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && index > 0 && !e.target.value) {
            otpInputs[index - 1].focus();
          }
        });
      });

      async function handleVerify(event) {
        event.preventDefault();
        const code = Array.from(otpInputs)
          .map((input) => input.value)
          .join("");
        if (code.length === 6) {
          await verifyOTP({ user_id: '<?php echo $_SESSION['user_id'] ?? ''; ?>', otp_code: code });
        } else {
          showToast('Please enter the complete 6-digit code');
        }
      }

      async function handleResend() {
        const result = await sendOTP({ 
          user_id: '<?php echo $_SESSION['user_id'] ?? ''; ?>', 
          email: '<?php echo $_SESSION['email'] ?? ''; ?>' 
        });
        if (result && result.success) {
          showToast('Verification code resent!');
        }
      }
    </script>
  </body>
</html>
