<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Account – FeedSpace</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-container">
        <div class="auth-header">
          <div class="verify-icon">
            <i class="fas fa-shield-alt"></i>
          </div>
          <h1 class="auth-title">Verify Your Login</h1>
          <p class="auth-subtitle">Enter the 6-digit code sent to your email</p>
          <p class="verify-code-info" id="visibleOtpText" style="display:none;">Use this code for testing.</p>
        </div>

        <form class="auth-form" onsubmit="handleVerify(event)">
          <div class="otp-inputs">
            <input
              type="text"
              class="otp-input"
              maxlength="1"
              inputmode="numeric"
              required
            />
            <input
              type="text"
              class="otp-input"
              maxlength="1"
              inputmode="numeric"
              required
            />
            <input
              type="text"
              class="otp-input"
              maxlength="1"
              inputmode="numeric"
              required
            />
            <input
              type="text"
              class="otp-input"
              maxlength="1"
              inputmode="numeric"
              required
            />
            <input
              type="text"
              class="otp-input"
              maxlength="1"
              inputmode="numeric"
              required
            />
            <input
              type="text"
              class="otp-input"
              maxlength="1"
              inputmode="numeric"
              required
            />
          </div>

          <button type="submit" class="auth-button">Verify Account</button>
        </form>

        <div class="verify-footer">
          <p class="verify-text">Didn't receive the code?</p>
          <p class="timer-text" id="verifyTimerText">Resend available in 03:00</p>
          <button type="button" class="resend-btn" id="verifyResendBtn" onclick="handleResend()">
            Resend Code
          </button>
        </div>

        <div class="auth-footer">
        <a href="../../index.html">Back to Sign In</a> 
        </div>
      </div>
    </div>

    <script src="../js/base.js"></script>
    <script src="../js/auth.js"></script>
    <script>
      const otpInputs = document.querySelectorAll(".otp-input");

      otpInputs.forEach((input, index) => {
        input.addEventListener("input", (e) => {
          if (e.target.value && index < otpInputs.length - 1) {
            otpInputs[index + 1].focus();
          }
        });

        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && index > 0 && !e.target.value) {
            otpInputs[index - 1].focus();
          }
        });
      });

      async function handleVerify(event) {
        event.preventDefault();
        console.log('handleVerify called');
        const code = Array.from(otpInputs)
          .map((input) => input.value)
          .join("");
        console.log('OTP code:', code);
        if (code.length === 6) {
          const urlParams = new URLSearchParams(window.location.search);
          const userId = urlParams.get('user_id');
          console.log('User ID:', userId);
          if (!userId) {
            showToast('User ID is missing');
            return;
          }
          console.log('Calling verifyOTP');
          await verifyOTP({ user_id: userId, otp_code: code });
        } else {
          showToast('Please enter the complete 6-digit code');
        }
      }

      let verifyTimer = null;
      let verifySeconds = 180;

      function formatTime(seconds) {
        const m = String(Math.floor(seconds / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        return `${m}:${s}`;
      }

      function updateVerifyTimer() {
        const timerText = document.getElementById('verifyTimerText');
        const resendBtn = document.getElementById('verifyResendBtn');
        if (!timerText || !resendBtn) {
          console.error('Timer elements not found');
          return;
        }

        if (verifySeconds <= 0) {
          clearInterval(verifyTimer);
          verifyTimer = null;
          resendBtn.disabled = false;
          timerText.textContent = 'You can resend the code now';
          return;
        }

        timerText.textContent = `Resend available in ${formatTime(verifySeconds)}`;
        resendBtn.disabled = true;
        verifySeconds -= 1;
        console.log('Timer updated:', verifySeconds);
      }

      function startVerifyTimer() {
        if (verifyTimer) {
          clearInterval(verifyTimer);
        }
        verifySeconds = 180;
        console.log('Starting timer with 180 seconds');
        updateVerifyTimer();
        verifyTimer = setInterval(updateVerifyTimer, 1000);
      }

      async function handleResend() {
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id');
        if (!userId) {
          showToast('User ID not found');
          return;
        }
        const resendBtn = document.getElementById('verifyResendBtn');
        if (resendBtn) {
          resendBtn.disabled = true;
        }
        startVerifyTimer();

        // Call login-otp.php with user_id for resend
        const result = await postAuth('login-otp.php', { 
          user_id: userId
        });
        if (result && result.success) {
          showToast('Verification code resent!');
          const otpText = document.getElementById('visibleOtpText');
          if (result.otp_code && otpText) {
            otpText.textContent = `Use this code for testing: ${result.otp_code}`;
            otpText.style.display = 'block';
            clearOtpInputs();
          }
        } else {
          showToast(result?.error || result?.message || 'Unable to resend code');
        }
      }

      function clearOtpInputs() {
        otpInputs.forEach((input) => {
          input.value = '';
        });
      }

      // Show OTP if it was passed from the previous page
      (function showPassedOtp() {
        const urlParams = new URLSearchParams(window.location.search);
        const otpCode = urlParams.get('otp_code');
        const otpText = document.getElementById('visibleOtpText');
        if (otpCode && otpText) {
          otpText.textContent = `Use this code for testing: ${otpCode}`;
          otpText.style.display = 'block';
          clearOtpInputs();
        }
      })();

      // Start timer on page load
      startVerifyTimer();
    </script>
  </body>
</html>
