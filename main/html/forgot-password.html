<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password – FeedSpace</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="feedspace-integration/main/css/base.css"/>
  <link rel="stylesheet" href="feedspace-integration/main/css/auth.css"/>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-container">
      <div class="auth-header">
        <a href="feedspace-integration\main\html\index.html" style="text-decoration: none; color: inherit;">
          <div class="auth-logo">
            <i class="fas fa-home"></i><span>FeedSpace</span>
          </div>
        </a>
        <h1 class="auth-title">Forgot Password?</h1>
        <p class="auth-subtitle">Enter your email to receive an OTP</p>
      </div>

      <form class="auth-form" onsubmit="handleForgotPassword(event)">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required/>
        </div>

        <button type="submit" class="auth-button">Send OTP</button>
      </form>
      
      <div class="auth-footer" style="margin-top: 20px; text-align: center;">
        <p style="margin-bottom: 10px;">
          <a href="feedspace-integration\main\html\index.html" style="color: #666; text-decoration: none;">Back to Sign In</a>
        </p>
      </div>

    </div>
  </div>

    <script src="./feedspace-integration\main\js\base.js"></script>
  <script src="feedspace-integration\main\js\auth.js"></script>
</body>
</html>
