<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password – FeedSpace</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../css/base.css"/>
  <link rel="stylesheet" href="../css/auth.css"/>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-container">
      <div class="auth-header">
        <div class="auth-logo">
          <i class="fas fa-home"></i><span>FeedSpace</span>
        </div>
        <h1 class="auth-title">Change Password</h1>
        <p class="auth-subtitle">Enter your new password below</p>
      </div>

      <form class="auth-form" onsubmit="handleResetPassword(event)">
        <div class="form-group">
          <label class="form-label" for="password">New Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="password" class="form-input" placeholder="••••••••" required/>
<button type="button" class="toggle-password" onclick="togglePassword('password')">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm">Confirm Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="confirm" class="form-input" placeholder="••••••••" required/>
            <button type="button" class="toggle-password" onclick="togglePassword('confirm')">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="password-strength">
          <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <p class="strength-text" id="strengthText">Password strength</p>
        </div>

        <button type="submit" class="auth-button">Update Password</button>
      </form>

      <div class="auth-footer">
        <p class="auth-footer-text">Back to <a href="/index.html">Sign in</a></p> 
      </div>
    </div>
  </div>

  <script>
    function togglePassword(fieldId) {
      const field = document.getElementById(fieldId);
      const button = field.nextElementSibling;
      const icon = button.querySelector('i');
      
      if (field.type === 'password') {
        field.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        field.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    function checkPasswordStrength(password) {
      let strength = 0;
      if (password.length >= 8) strength++;
      if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
      if (/\d/.test(password)) strength++;
      if (/[^a-zA-Z\d]/.test(password)) strength++;
      
      const fill = document.getElementById('strengthFill');
      const text = document.getElementById('strengthText');
      
      fill.style.width = (strength * 25) + '%';
      const strengths = ['Weak', 'Fair', 'Good', 'Strong', 'Very Strong'];
      text.textContent = strengths[strength] || 'Password strength';
    }

    document.getElementById('password').addEventListener('input', (e) => {
      checkPasswordStrength(e.target.value);
    });

    function handleResetPassword(event) {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password === confirm && password.length >= 8) {
        alert('Password updated successfully!');
        window.location.href = '/index.html';
      } else {
        alert('Passwords do not match or are too short');
      }
    }
  </script>
</body>
</html>
